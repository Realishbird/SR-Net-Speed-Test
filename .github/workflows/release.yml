name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

# Runs on main must not overlap: each one computes the next version from the
# tags it sees at checkout, so three merges in a minute all claimed v0.1.15 and
# uploaded over each other's assets. Queueing them makes each run see the tag
# the previous one created. Pull request runs still run side by side.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Every push to main publishes the next patch release (v0.1.0 -> v0.1.1) so
  # merging a PR is enough to ship. A manual vX.Y.Z tag still releases that
  # exact version, for minor or major bumps.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/heads/main && -z "$(git tag --points-at HEAD 'v*')" ]]; then
            last=$(git tag -l 'v*' --sort=-v:refname | head -1)
            IFS=. read -r major minor patch <<< "${last:-v0.0.0}"
            echo "version=${major}.${minor}.$((patch + 1))" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: shellcheck
        run: |
          sudo apt-get install -y -qq shellcheck >/dev/null
          shellcheck -S warning install.sh deploy/install-controller.sh proxmox/create-lxc.sh

  build:
    needs: [test, version]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          mkdir -p dist
          for bin in srnet-agent srnet-controller srnet; do
            go build -trimpath -ldflags "-s -w -X github.com/Realishbird/SR-Net-Speed-Test/internal/version.Version=$VERSION" \
              -o "dist/$bin-linux-${{ matrix.arch }}" "./cmd/$bin"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*

  release:
    if: needs.version.outputs.publish == 'true'
    needs: [build, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
