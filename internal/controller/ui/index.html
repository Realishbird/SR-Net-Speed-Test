<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SR-Net-Speed-Test</title>
<style>
:root {
  --bg:#f5f6f8; --surface:#ffffff; --fg:#15181d; --muted:#67707c; --line:#e3e6ea; --hover:#f0f2f5;
  --accent:#2f6fed; --accent-fg:#ffffff; --pass:#1a8a4a; --warn:#b7650c; --fail:#c9302c; --info:#2f6fed;
  --shadow:0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.1);
  --radius:12px; --mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0f1216; --surface:#171b21; --fg:#e8eaed; --muted:#99a2ad; --line:#272d36; --hover:#1e242c;
    --accent:#6ea0ff; --accent-fg:#0b1220; --pass:#4ade80; --warn:#fbbf24; --fail:#f87171; --info:#6ea0ff;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  --bg:#0f1216; --surface:#171b21; --fg:#e8eaed; --muted:#99a2ad; --line:#272d36; --hover:#1e242c;
  --accent:#6ea0ff; --accent-fg:#0b1220; --pass:#4ade80; --warn:#fbbf24; --fail:#f87171; --info:#6ea0ff;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; font:14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--fg); }
a { color:var(--accent); }
.app { display:grid; grid-template-columns:220px 1fr; min-height:100%; }
nav { background:var(--surface); border-right:1px solid var(--line); padding:18px 12px; display:flex; flex-direction:column; gap:4px; position:sticky; top:0; height:100vh; }
nav .brand { font-weight:700; font-size:15px; padding:6px 10px 14px; letter-spacing:.2px; }
nav .brand small { display:block; font-weight:400; color:var(--muted); font-size:12px; }
nav a { display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px; color:var(--fg); text-decoration:none; font-weight:500; }
nav a:hover { background:var(--hover); }
nav a.on { background:color-mix(in srgb, var(--accent) 14%, transparent); color:var(--accent); }
nav a svg { width:18px; height:18px; flex:none; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
nav .badge { margin-left:auto; }
nav .foot { margin-top:auto; padding:10px; color:var(--muted); font-size:12px; display:flex; flex-direction:column; gap:6px; }
main { padding:28px 32px 60px; min-width:0; }
.page-head { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
.page-head h1 { font-size:22px; margin:0; font-weight:650; }
.page-head .spacer { flex:1; }
.sub { color:var(--muted); font-size:13px; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px; margin-bottom:16px; }
.card h2 { font-size:14px; margin:0 0 10px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
.tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:12px; margin-bottom:16px; }
.tile { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 16px; }
.tile .k { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.4px; }
.tile .v { font-size:26px; font-weight:650; margin-top:4px; font-variant-numeric:tabular-nums; }
.tile .v small { font-size:13px; color:var(--muted); font-weight:400; margin-left:4px; }
.tbl { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:auto; margin-bottom:16px; }
table { border-collapse:collapse; width:100%; }
th, td { text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); white-space:nowrap; vertical-align:middle; }
thead th { position:sticky; top:0; background:var(--surface); color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.4px; z-index:1; }
tbody tr:last-child td { border-bottom:0; }
tbody tr:hover td { background:var(--hover); }
td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
td.wrap { white-space:normal; }
.empty { color:var(--muted); padding:22px 12px; text-align:center; }
input, select, button, textarea { font:inherit; color:inherit; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:7px 10px; }
input:focus, select:focus, textarea:focus { outline:2px solid color-mix(in srgb, var(--accent) 40%, transparent); outline-offset:0; border-color:var(--accent); }
input.cell { width:120px; border-color:transparent; background:transparent; padding:4px 6px; border-radius:6px; }
input.cell:hover { border-color:var(--line); }
input.cell:focus { border-color:var(--accent); background:var(--surface); }
button { cursor:pointer; font-weight:500; }
button:hover { background:var(--hover); }
button.primary { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
button.primary:hover { filter:brightness(1.08); background:var(--accent); }
button.danger { color:var(--fail); border-color:color-mix(in srgb, var(--fail) 40%, var(--line)); }
button.sm { padding:4px 9px; font-size:12px; }
button:disabled { opacity:.5; cursor:default; }
.row { display:flex; gap:12px; flex-wrap:wrap; align-items:end; }
.row label, .row .field { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); }
.row label.inline { flex-direction:row; align-items:center; color:var(--fg); }
.topo svg { width:100%; height:auto; display:block; font:14px system-ui, sans-serif; }
.topo .box { fill:var(--surface); stroke:var(--line); }
.topo .box.off { stroke-dasharray:4 3; }
.topo .sw { fill:color-mix(in srgb, var(--accent) 8%, var(--surface)); stroke:var(--accent); }
.topo .stub { fill:var(--bg); stroke:var(--line); }
.topo .stub.up { stroke:var(--pass); }
.topo .stub.down { stroke:var(--fail); }
.topo .stub.busy { fill:color-mix(in srgb, var(--accent) 25%, var(--surface)); }
.topo text { fill:var(--fg); }
.topo .mut { fill:var(--muted); font-size:12.5px; }
.topo .sm { font-size:12px; }
.topo .link { fill:none; stroke-linecap:round; }
.topo .link.idle { opacity:.35; }
.topo .link.leg { filter:drop-shadow(0 0 3px var(--accent)); }
.topo .rate { font-weight:600; paint-order:stroke; stroke:var(--surface); stroke-width:4px; stroke-linejoin:round; }
.topo .meter { fill:var(--line); }
.topo .meter i { fill:var(--accent); }
.badge { display:inline-block; font-weight:600; padding:2px 9px; border-radius:999px; font-size:11.5px; line-height:1.6; text-transform:lowercase; }
.badge.pass, .badge.done, .badge.active { color:var(--pass); background:color-mix(in srgb, var(--pass) 14%, transparent); }
.badge.warn, .badge.skipped, .badge.canceled { color:var(--warn); background:color-mix(in srgb, var(--warn) 14%, transparent); }
.badge.fail, .badge.failed, .badge.open, .badge.down { color:var(--fail); background:color-mix(in srgb, var(--fail) 14%, transparent); }
.badge.running, .badge.queued, .badge.updating, .badge.pending, .badge.info { color:var(--info); background:color-mix(in srgb, var(--info) 14%, transparent); }
.chk { display:inline-block; padding:1px 7px; border-radius:6px; font-size:12px; margin:1px 0; border:1px solid var(--line); }
.chk.ok { color:var(--pass); } .chk.bad { color:var(--fail); border-color:color-mix(in srgb, var(--fail) 50%, var(--line)); font-weight:600; } .chk.unknown { color:var(--muted); } .chk.skip { color:var(--muted); opacity:.6; }
.delta-good { color:var(--pass); font-variant-numeric:tabular-nums; } .delta-flat { color:var(--muted); font-variant-numeric:tabular-nums; } .delta-bad { color:var(--warn); font-weight:600; font-variant-numeric:tabular-nums; }
.badge.muted { color:var(--muted); background:var(--hover); }
.dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--fail); box-shadow:0 0 0 3px color-mix(in srgb, var(--fail) 18%, transparent); }
.dot.on { background:var(--pass); box-shadow:0 0 0 3px color-mix(in srgb, var(--pass) 18%, transparent); }
.muted { color:var(--muted); }
.mono { font-family:var(--mono); font-size:12.5px; }
pre { background:var(--hover); border:1px solid var(--line); padding:12px; border-radius:8px; overflow:auto; font:12.5px/1.5 var(--mono); margin:0; white-space:pre-wrap; word-break:break-all; }
textarea { width:100%; font:12.5px/1.5 var(--mono); resize:vertical; }
.live { color:var(--info); font-size:12px; display:inline-flex; align-items:center; gap:6px; }
.live::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--info); animation:pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.25 } }
.bar { height:6px; background:var(--hover); border-radius:999px; overflow:hidden; min-width:90px; }
.bar i { display:block; height:100%; background:var(--accent); border-radius:999px; }
.toasts { position:fixed; right:18px; bottom:18px; display:flex; flex-direction:column; gap:8px; z-index:50; max-width:420px; }
.toast { background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--info); border-radius:10px; padding:10px 14px; box-shadow:0 8px 24px rgba(0,0,0,.18); animation:in .15s ease-out; }
.toast.fail { border-left-color:var(--fail); } .toast.pass { border-left-color:var(--pass); } .toast.warn { border-left-color:var(--warn); }
@keyframes in { from { transform:translateY(8px); opacity:0 } }
.overlay { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; z-index:40; padding:16px; }
.modal { background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:0 20px 60px rgba(0,0,0,.35); width:min(720px, 100%); max-height:90vh; overflow:auto; }
.modal header { display:flex; align-items:center; padding:16px 20px; border-bottom:1px solid var(--line); font-weight:650; font-size:16px; }
.modal header button { margin-left:auto; }
.modal .body { padding:18px 20px; }
.modal footer { display:flex; gap:8px; justify-content:flex-end; padding:14px 20px; border-top:1px solid var(--line); }
.help { font-size:12.5px; color:var(--muted); margin:4px 0 12px; }
.chips { display:flex; gap:6px; flex-wrap:wrap; }
.chip { font-size:12px; padding:2px 8px; border-radius:999px; background:var(--hover); border:1px solid var(--line); }
.picker { display:flex; flex-wrap:wrap; gap:4px; align-items:center; min-height:36px; padding:3px 6px; border:1px solid var(--line); border-radius:8px; background:var(--surface); cursor:text; }
.picker:focus-within { outline:2px solid color-mix(in srgb, var(--accent) 40%, transparent); border-color:var(--accent); }
.picker input.pick-in { flex:1; min-width:120px; border:0; outline:0; padding:4px; background:transparent; }
.picker .chip button { border:0; background:none; padding:0 0 0 4px; cursor:pointer; color:var(--muted); font-size:13px; line-height:1; }
.picker .chip button:hover { color:var(--fail); }
button.chip { cursor:pointer; }
button.chip:hover { border-color:var(--accent); }
.kv { display:grid; grid-template-columns:max-content 1fr; gap:6px 18px; font-size:13px; }
.kv b { font-weight:500; color:var(--muted); }
@media (max-width: 860px) {
  .app { grid-template-columns:1fr; }
  nav { position:static; height:auto; flex-direction:row; flex-wrap:wrap; border-right:0; border-bottom:1px solid var(--line); padding:10px 12px; }
  nav .brand { width:100%; padding-bottom:6px; } nav .brand small { display:none; }
  nav a { padding:7px 10px; } nav a span.t { display:none; } nav .foot { display:none; }
  main { padding:18px 16px 50px; }
}
body.viewer nav a[data-page="new"], body.viewer nav a[data-page="settings"], body.viewer button.primary, body.viewer button.danger, body.viewer input.cell { pointer-events:none; opacity:.45 }
</style>
</head>
<body>
<div class="app">
<nav>
  <div class="brand">SR-Net-Speed-Test<small id="ver">controller</small></div>
  <a href="#overview" data-page="overview"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg><span class="t">Overview</span></a>
  <a href="#hosts" data-page="hosts"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="1"/><rect x="3" y="14" width="18" height="6" rx="1"/><path d="M7 7h.01M7 17h.01"/></svg><span class="t">Hosts</span></a>
  <a href="#topology" data-page="topology"><svg viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="5" rx="1"/><rect x="2" y="16" width="6" height="5" rx="1"/><rect x="9" y="16" width="6" height="5" rx="1"/><rect x="16" y="16" width="6" height="5" rx="1"/><path d="M12 8v4M5 16v-4h14v4M12 12v4"/></svg><span class="t">Topology</span></a>
  <a href="#fabric" data-page="fabric"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/><path d="M9 4l-2 3 2 3M15 14l2 3-2 3"/></svg><span class="t">Fabric</span><span class="badge warn" id="fabric-count" style="display:none"></span></a>
  <a href="#runs" data-page="runs"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 15l5-5 4 4 7-8"/></svg><span class="t">Runs</span></a>
  <a href="#new" data-page="new"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span class="t">New run</span></a>
  <a href="#suites" data-page="suites"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg><span class="t">Suites</span></a>
  <a href="#fleet" data-page="fleet"><svg viewBox="0 0 24 24"><path d="M12 3v12M8 11l4 4 4-4"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg><span class="t">Fleet</span></a>
  <a href="#switches" data-page="switches"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="10" rx="2"/><path d="M6 11h.01M9 11h.01M12 11h.01M15 11h.01M18 11h.01M6 14h12"/></svg><span class="t">Switches</span></a>
  <a href="#alerts" data-page="alerts"><svg viewBox="0 0 24 24"><path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17h.01"/></svg><span class="t">Alerts</span><span class="badge fail" id="alert-count" style="display:none"></span></a>
  <a href="#settings" data-page="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg><span class="t">Settings</span></a>
  <a id="grafana" href="#" target="_blank"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 15l3-4 3 2 4-6"/></svg><span class="t">Grafana</span></a>
  <div class="foot"><span id="clock"></span><span id="me" class="sub"></span><button class="sm" id="signout" style="display:none" onclick="signOut()">Sign out</button><button class="sm" id="pwbtn" onclick="changePassword()" title="Change the admin login password">Password</button><button class="sm" onclick="toggleTheme()">Toggle theme</button></div>
</nav>
<main id="view"></main>
</div>
<div class="toasts" id="toasts"></div>
<script>
/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n, d = 1) => (n == null || isNaN(n) ? 0 : +n).toFixed(d);
const when = s => s ? new Date(s).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' }) : '';
const ago = s => { if (!s) return ''; const m = Math.round((Date.now() - new Date(s)) / 60000); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' d ago'; };
const badge = (s, cls) => s ? `<span class="badge ${cls || s}">${esc(s)}</span>` : '';
const list = s => String(s || '').split(',').map(x => x.trim()).filter(Boolean);

async function api(method, path, body) {
  const opt = { method, headers: {} };
  if (body !== undefined) { opt.headers['Content-Type'] = typeof body === 'string' ? 'text/csv' : 'application/json'; opt.body = typeof body === 'string' ? body : JSON.stringify(body); }
  const r = await fetch('/api/v1' + path, opt);
  if (r.status === 401) { location.reload(); throw new Error('login required'); } // the password changed; the browser must ask again
  if (r.status === 204) return null;
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText || ('HTTP ' + r.status));
  return j;
}

function toast(msg, cls = 'info', ms = 5000) {
  const el = document.createElement('div');
  el.className = 'toast ' + cls; el.textContent = msg?.message || msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), ms);
}
const fail = e => toast(e, 'fail', 8000);

function modal({ title, body, actions = [], onClose }) {
  closeModal();
  const ov = document.createElement('div'); ov.className = 'overlay'; ov.id = 'modal';
  ov.innerHTML = `<div class="modal" role="dialog"><header>${esc(title)}<button class="sm" onclick="closeModal()">Close</button></header><div class="body">${body}</div>
    ${actions.length ? `<footer>${actions.map((a, i) => `<button class="${a.cls || ''}" data-i="${i}">${esc(a.label)}</button>`).join('')}</footer>` : ''}</div>`;
  ov.addEventListener('click', e => { if (e.target === ov) closeModal(); });
  ov.querySelectorAll('footer button').forEach(b => b.onclick = async () => { const a = actions[+b.dataset.i]; if (a.run) { b.disabled = true; try { await a.run(); } finally { b.disabled = false; } } if (a.close !== false) closeModal(); });
  ov.onclose = onClose;
  document.body.appendChild(ov);
  return ov;
}
// changePassword asks for the current and a new admin password. Basic auth
// means the browser keeps the old one cached, so after a change the next
// request fails once and the browser asks for the new login.
function changePassword() {
  modal({ title: 'Change admin password', body: `<form id="pw-form" onsubmit="return false"><div class="row" style="flex-direction:column;align-items:stretch">
      <label>Current password<input type="password" id="pw-cur" autocomplete="current-password" required></label>
      <label>New password (8+ characters)<input type="password" id="pw-new" autocomplete="new-password" minlength="8" required></label>
      <label>Repeat new password<input type="password" id="pw-rep" autocomplete="new-password" minlength="8" required></label></div>
      <p class="muted" style="margin:10px 0 0">Your browser will ask you to log in again with the new password.</p></form>`,
    actions: [{ label: 'Cancel' }, { label: 'Change password', cls: 'primary', close: false, run: async () => {
      const cur = $('#pw-cur').value, nw = $('#pw-new').value, rep = $('#pw-rep').value;
      if (nw.length < 8) return toast('New password must be at least 8 characters', 'warn');
      if (nw !== rep) return toast('The new passwords do not match', 'warn');
      try { await api('POST', '/admin/password', { current: cur, new: nw }); } catch (e) { return fail(e); }
      closeModal(); toast('Password changed. Log in again with the new one when the browser asks.', 'pass', 10000);
    } }] });
  setTimeout(() => $('#pw-cur')?.focus(), 50);
}
function closeModal() { const m = $('#modal'); if (m) { m.onclose?.(); m.remove(); } }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
function confirmBox(title, text, label, run) { modal({ title, body: `<p>${esc(text)}</p>`, actions: [{ label: 'Cancel' }, { label, cls: 'danger', run }] }); }

async function copyText(t, btn) { try { await navigator.clipboard.writeText(t); if (btn) { const o = btn.textContent; btn.textContent = 'Copied'; setTimeout(() => btn.textContent = o, 1500); } } catch { toast('Copy failed; select the text and copy it by hand', 'warn'); } }

function toggleTheme() {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('theme', next); } catch {}
}
try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}

/* ---------- router and refresh loop ----------
   A page renders its shell once, then its refresh() only updates data regions.
   Refreshes are skipped while the user is editing, has text selected, a dialog
   is open, or the tab is hidden, so nothing on screen is pulled away. */
let nav = 0, timer = null, refreshFn = null;
function setRefresh(fn, ms) {
  clearInterval(timer); refreshFn = fn;
  if (fn) timer = setInterval(() => { if (busy()) return; fn().catch(fail); }, ms);
}
function busy() {
  if (document.hidden || $('#modal')) return true;
  const a = document.activeElement;
  if (a && $('#view').contains(a) && ['INPUT', 'TEXTAREA', 'SELECT'].includes(a.tagName)) return true;

const fabricPalette = ['#2f6fed', '#d97706', '#0f9d58', '#9333ea', '#dc2626', '#0891b2', '#65a30d', '#db2777'];

function drawTopology(t) {

    out.push(`<text x="${sx + 10}" y="${SWY + 18}" font-weight="600">${esc(s.name)}</text><text class="mut" x="${sx + 10}" y="${SWY + 34}">${esc(s.address)}${s.source ? ' · ' + esc(s.source) : ' · no counters yet'}</text>`);

    if (st) {
      const cpu = Math.min(100, Math.max(0, st.cpu_pct || 0));

      out.push(`<rect class="meter" x="${x0 + 10}" y="${y0 + 64}" width="${HW - 20}" height="6" rx="3"/><rect x="${x0 + 10}" y="${y0 + 64}" width="${(HW - 20) * cpu / 100}" height="6" rx="3" fill="${cpu > 85 ? 'var(--fail)' : cpu > 60 ? 'var(--warn)' : 'var(--accent)'}"/>`);
    } else out.push(`<text class="sm mut" x="${x0 + 10}" y="${y0 + 55}">${h.online ? 'no telemetry yet' : 'offline'}</text>`);

async function pageTopology(token) {

    <p class="help">Drawn from each host's LLDP neighbour and the switch's own port counters. Line width follows the live rate; the legs of a run in progress glow. Switch ports and the fabric column come from the switch itself (its LLDP and VLAN tables, polled every minute) or from the host's lldpd; "no LLDP" means neither has seen a neighbour on that port yet.</p>
    <div class="card topo" style="padding:10px 10px 4px" id="tp-svg"></div><div id="tp-warn"></div>
    <div class="card"><h2>Switch ports in use</h2><div class="tbl" style="margin:0;box-shadow:none"><table><thead><tr><th>Switch</th><th>Port</th><th>Link</th><th>Host</th><th>Host port</th><th>IP</th><th>Fabric</th><th class="num">In Gbps</th><th class="num">Out Gbps</th><th class="num">Discards in / out</th><th class="num">Errors in / out</th><th class="num">FCS</th></tr></thead><tbody id="tp-ports"></tbody></table></div></div>
    <div class="card"><h2>Hosts under test</h2><div class="tbl" style="margin:0;box-shadow:none"><table><thead><tr><th></th><th>Host</th><th class="num">CPU</th><th class="num">Load</th><th class="num">Memory</th><th>Ports</th><th>Switch ports</th><th title="NIC chip and transceiver (optic) temperature per port, from the agent's sensors">Temperatures</th><th class="num">TX / RX Gbps</th></tr></thead><tbody id="tp-hosts"></tbody></table></div></div>`)) return;
  const refresh = async () => {
    const t = await api('GET', '/topology');
    set('tp-svg', drawTopology(t));
    set('tp-warn', t.warning ? `<div class="card" style="border-color:var(--warn);color:var(--warn)">${esc(t.warning)}</div>` : '');
    const byPort = {}, peer = {};
    for (const h of t.hosts) for (const p of h.ports) if (p.switch && p.switch_port) byPort[(p.switch + '/' + p.switch_port).toLowerCase()] = { h, p };
    for (const l of t.links || []) { peer[(l.a + '/' + l.a_port).toLowerCase()] = l.b + ' ' + l.b_port; peer[(l.b + '/' + l.b_port).toLowerCase()] = l.a + ' ' + l.a_port; }
    const rows = t.switches.flatMap(s => s.ports.map(p => {
      const m = byPort[(s.name + '/' + p.name).toLowerCase()];
      const bad = (p.in_discards || 0) + (p.out_discards || 0) + (p.in_errors || 0) + (p.out_errors || 0) + (p.fcs_errors || 0) > 0;
      return `<tr><td>${esc(s.name)}</td><td class="mono">${esc(p.name)}</td><td>${p.up == null ? '<span class="muted">?</span>' : badge(p.up ? 'up' : 'down', p.up ? 'pass' : 'fail')}${p.speed_mbps ? ` <span class="muted">${p.speed_mbps / 1000}G</span>` : ''}</td>
        <td>${m ? `<b>${esc(m.h.name)}</b>` : peer[(s.name + '/' + p.name).toLowerCase()] ? `<span class="muted" title="Cable to another switch">switch ${esc(peer[(s.name + '/' + p.name).toLowerCase()])}</span>` : '<span class="muted">-</span>'}</td><td class="mono">${m ? esc(m.p.label || m.p.netdev) : ''}</td><td class="mono">${m?.p.ip ? esc(m.p.ip) : ''}</td><td>${p.vlan ? `${esc(p.vlan)}${m?.p.fabric && m.p.fabric !== p.vlan ? ` <span class="badge fail" title="The host port's fabric label does not match the VLAN the switch has this port in">host says ${esc(m.p.fabric)}</span>` : ''}` : esc(m?.p.fabric || '')}</td>
        <td class="num">${fmt(p.rx_gbps)}</td><td class="num">${fmt(p.tx_gbps)}</td><td class="num" style="color:${bad ? 'var(--warn)' : 'inherit'}">${fmt(p.in_discards, 0)} / ${fmt(p.out_discards, 0)}</td><td class="num" style="color:${bad ? 'var(--warn)' : 'inherit'}">${fmt(p.in_errors, 0)} / ${fmt(p.out_errors, 0)}</td><td class="num">${fmt(p.fcs_errors, 0)}</td></tr>`;
    }));
    set('tp-ports', rows.join('') || `<tr><td colspan="12" class="empty">${t.switches.length ? 'No switch port is mapped to a host yet and none carries traffic. The mapping appears once hosts report LLDP neighbours.' : 'No switch configured.'}</td></tr>`);
    set('tp-hosts', t.hosts.map(h => {
      const st = h.stats, tx = h.ports.reduce((a, p) => a + (p.tx_gbps || 0), 0), rx = h.ports.reduce((a, p) => a + (p.rx_gbps || 0), 0);
      const cpu = st ? st.cpu_pct : null;
      return `<tr><td><span class="dot ${h.online ? 'on' : ''}"></span></td><td><b>${esc(h.name)}</b> <span class="muted">${esc(h.hostname)}</span></td>
        <td class="num" style="color:${cpu > 85 ? 'var(--fail)' : cpu > 60 ? 'var(--warn)' : 'inherit'}">${st ? fmt(cpu, 0) + '%' : '<span class="muted">-</span>'}</td><td class="num">${st ? fmt(st.load1, 2) : ''}</td><td class="num">${st ? fmt(st.mem_pct, 0) + '%' : ''}</td>
        <td>${h.ports.filter(p => p.ip).map(p => `<span class="chip">${esc(p.label || p.netdev)} <span class="muted">${esc(p.ip)}</span></span>`).join(' ')}</td>
        <td>${h.ports.filter(p => !p.twin_of && (p.switch_port || p.lldp_port)).map(p => `<span class="mono">${esc(p.switch || p.lldp_switch)} ${esc(p.switch_port || p.lldp_port)}</span>`).join(', ') || '<span class="muted">no LLDP yet</span>'}</td>
        <td>${tempCells(h.ports.filter(p => !p.twin_of && (p.optic_c || p.nic_c)), t.optic_max_c, t.nic_max_c)}</td>
        <td class="num">${fmt(tx)} / ${fmt(rx)}</td></tr>`;
    }).join('') || `<tr><td colspan="9" class="empty">No hosts enrolled yet.</td></tr>`);
    const legs = (t.runs || []).reduce((a, r) => a + r.legs.length, 0);
    set('tp-legs', legs ? `<span class="live">live</span> ${legs} leg${legs === 1 ? '' : 's'} running` : '');
    set('tp-upd', 'updated ' + new Date().toLocaleTimeString());
  };
  await refresh(); setRefresh(refresh, 3000);
}

/* ---------- fabric check ---------- */
const fabricFields = [
  ['mode', 'Mode', 'select', 'lossless = PFC and ECN expected, drops are a fault; lossy = PFC off expected, drops allowed; blank = consistency only'],
  ['switch_mtu', 'Switch MTU at least', 'number', ''], ['host_mtu', 'Host MTU at least', 'number', ''], ['speed_mbps', 'Speed Mbps (0 = any)', 'number', ''],
  ['vlan', 'VLAN (blank = fabric name)', 'text', ''], ['pfc_priority', 'PFC priority (-1 = off)', 'number', ''], ['ecn_queue', 'ECN queue (-1 = unchecked)', 'number', ''],
  ['roce_dscp', 'RoCE DSCP (-1 = unchecked)', 'number', ''], ['cnp_dscp', 'CNP DSCP (-1 = unchecked)', 'number', ''], ['roce_mode', 'RoCE mode', 'text', ''], ['trust', 'Host trust (dscp, pcp, blank)', 'text', ''],
];
async function pageFabric(token) {
  if (!mount(token, `<div class="page-head"><h1>Fabric check</h1><span id="fb-sum"></span><span class="spacer"></span><span class="sub" id="fb-upd"></span></div>
    <p class="help">Every cable the controller knows, with each setting on the switch side (read over gNMI once a minute: MTU, speed, FEC, VLAN, PFC, QoS map, queue drops, ECN marks, pause frames) and the host side (reported by the agent: MTU, RoCE mode, PFC, trust, DSCP map, ECN) against the fabric's profile. Without a profile only consistency is checked: both ends agree on speed and PFC, the VLAN matches the fabric, the link is up, and the MTUs carry a 4096-byte RDMA MTU. A failing cable opens a <span class="mono">fabric_mismatch</span> alert, and a run that starts on it carries the findings in its summary.</p>
    <div id="fb-warn"></div>
    <div class="card"><h2>Fabric profiles</h2><div id="fb-profiles"></div></div>
    <div class="tbl"><table><thead><tr><th>Fabric</th><th>Host</th><th>Port</th><th>Switch port</th><th>State</th><th>Checks</th><th>Switch counters</th></tr></thead><tbody id="fb-cables"></tbody></table></div>`)) return;
  const refresh = async () => {
    const fc = await api('GET', '/fabric-check');
    window._fabricProfiles = fc.profiles;
    set('fb-warn', fc.warning ? `<div class="card" style="border-color:var(--warn);color:var(--warn)">${esc(fc.warning)}</div>` : '');
    set('fb-sum', fc.cables.length ? (fc.issues ? badge(`${fc.issues} of ${fc.cables.length} cables need attention`, 'fail') : badge(`${fc.cables.length} cables ok`, 'pass')) : '');
    const fabrics = [...new Set([...fc.profiles.map(p => p.fabric), ...fc.cables.map(c => c.fabric).filter(Boolean)])].sort();
    set('fb-profiles', (fabrics.length ? fabrics.map(f => { const p = fc.profiles.find(x => x.fabric === f);
      return `<div class="row" style="margin-bottom:8px"><b style="width:90px">Fabric ${esc(f)}</b><span class="sub" style="width:260px">${p ? `${esc(p.mode || 'consistency only')} · PFC ${p.pfc_priority >= 0 ? 'priority ' + p.pfc_priority : 'off'} · ECN ${p.ecn_queue >= 0 ? 'queue ' + p.ecn_queue : 'unchecked'} · MTU ≥ ${p.switch_mtu}/${p.host_mtu}` : 'no profile: consistency checks only'}</span>
        <button class="sm" onclick="editFabric('${esc(f)}')">${p ? 'Edit' : 'Set profile'}</button>${p ? ` <button class="sm danger" onclick="delFabric('${esc(f)}')">Remove</button>` : ''}</div>`; }).join('') : '<span class="muted">No fabrics yet: label host ports with a fabric on the Hosts page, or let the switch VLANs name them.</span>')
      + `<p class="help" style="margin:8px 0 0">A profile starts from a preset: <b>lossless RoCE</b> (DSCP 26 to queue 3, PFC on priority 3, ECN on queue 3, CNPs on DSCP 48, host trust dscp with ECN on) or <b>lossy</b> (PFC off, no QoS map, drops allowed). Edit any field afterwards.</p>`);
    set('fb-cables', fc.cables.length ? fc.cables.map(c => {
      const checks = c.checks.map(k => `<span class="chk ${k.state}" title="${esc([k.want ? 'want: ' + k.want : '', k.switch ? 'switch: ' + k.switch : '', k.host ? 'host: ' + k.host : '', k.note].filter(Boolean).join('\n'))}">${esc(k.name)}${k.state === 'ok' ? '' : k.state === 'bad' ? ' ✕' : ' ?'}</span>`).join(' ');
      const notes = c.checks.filter(k => k.state === 'bad').map(k => `<div class="muted" style="font-size:12px">${esc(k.name)}: ${esc(k.note)}</div>`).join('');
      const ctr = Object.entries(c.counters || {}).filter(([k, v]) => v > 0 || k.startsWith('pause')).map(([k, v]) => `${esc(k)} ${fmt(v, 0)}`).join(', ');
      return `<tr><td>${esc(c.fabric || '-')}</td><td>${esc(c.host)}</td><td><span class="mono">${esc(c.netdev)}</span>${c.label ? ` <span class="muted">${esc(c.label)}</span>` : ''}${c.ip ? ` <span class="muted mono">${esc(c.ip)}</span>` : ''}</td>
        <td class="mono">${c.switch_port ? esc(c.switch + ' ' + c.switch_port) : '<span class="muted">-</span>'}</td><td>${badge(c.ok ? 'ok' : 'mismatch', c.ok ? 'pass' : 'fail')}</td><td class="wrap">${checks}${notes}</td><td class="muted wrap" style="font-size:12px">${ctr || '-'}</td></tr>`;
    }).join('') : `<tr><td colspan="7" class="empty">No cabled ports yet.</td></tr>`);
    set('fb-upd', 'checked ' + new Date(fc.at).toLocaleTimeString());
  };
  await refresh(); setRefresh(refresh, 15000);
}
async function editFabric(fabric) {
  const presets = await api('GET', '/fabrics/presets');
  const cur = (window._fabricProfiles || []).find(p => p.fabric === fabric) || { ...presets.lossy, fabric, mode: '' };
  const field = ([k, label, type, help], v) => type === 'select'
    ? `<label title="${esc(help)}">${esc(label)} <select name="${k}"><option value="" ${!v ? 'selected' : ''}>consistency only</option><option value="lossless" ${v === 'lossless' ? 'selected' : ''}>lossless</option><option value="lossy" ${v === 'lossy' ? 'selected' : ''}>lossy</option></select></label>`
    : `<label>${esc(label)} <input name="${k}" type="${type}" value="${esc(v ?? '')}" style="width:${type === 'number' ? 90 : 120}px"></label>`;
  const render = p => fabricFields.map(f => field(f, p[f[0]])).join('') + `<label class="inline"><input type="checkbox" name="host_ecn" ${p.host_ecn ? 'checked' : ''}> Host ECN (np and rp) on the PFC priority</label>`;
  modal({ title: `Fabric ${fabric} profile`, body: `<div class="row" style="margin-bottom:10px"><button type="button" class="sm" onclick="fabricPreset('lossless')">Lossless RoCE preset</button><button type="button" class="sm" onclick="fabricPreset('lossy')">Lossy preset</button></div><form id="fb-form" class="row" onsubmit="return false">${render(cur)}</form>`,
    actions: [{ label: 'Cancel' }, { label: 'Save', cls: 'primary', close: false, run: async () => {
      const f = new FormData($('#fb-form')), g = k => f.get(k);
      const p = { fabric, mode: g('mode'), switch_mtu: +g('switch_mtu'), host_mtu: +g('host_mtu'), speed_mbps: +g('speed_mbps'), vlan: g('vlan').trim(), pfc_priority: +g('pfc_priority'), ecn_queue: +g('ecn_queue'),
        roce_dscp: +g('roce_dscp'), cnp_dscp: +g('cnp_dscp'), roce_mode: g('roce_mode').trim(), trust: g('trust').trim(), host_ecn: !!g('host_ecn') };
      try { await api('PUT', '/fabrics/' + encodeURIComponent(fabric), p); toast('Profile saved; the check re-runs now', 'pass'); closeModal(); refreshFn?.(); } catch (e) { fail(e); }
    } }] });
  window._fabricPresets = presets; window._fabricRender = render;
}
function fabricPreset(mode) { const f = $('#fb-form'); if (f) f.innerHTML = window._fabricRender({ ...window._fabricPresets[mode], fabric: '' }); }
function delFabric(fabric) { confirmBox('Remove profile', `Remove the profile of fabric ${fabric}? Its cables go back to consistency checks only.`, 'Remove', async () => { await api('DELETE', '/fabrics/' + encodeURIComponent(fabric)); refreshFn?.(); }); }

/* ---------- runs ---------- */
async function pageRuns(token) {
  if (!mount(token, `<div class="page-head"><h1>Runs</h1><span class="spacer"></span>
      <button onclick="cleanupRuns()" title="Delete failed or old runs in one go">Clean up</button>
      <button class="danger" id="del-sel" disabled onclick="deleteSelectedRuns()">Delete selected</button>
      <a href="#new"><button class="primary">New run</button></a></div>
    <div class="tbl"><table><thead><tr><th><input type="checkbox" onchange="$$('.run-sel').forEach(c => { c.checked = this.checked; }); selCount()"></th><th>ID</th><th>Name</th><th>Test</th><th>Topology</th><th>Status</th><th>Verdict</th><th class="num">Tool Gbps</th><th class="num">Counter Gbps</th><th class="num" title="Aggregate against the newest baseline run of the same shape">vs baseline</th><th>Started</th></tr></thead><tbody id="runs"></tbody></table></div>`)) return;
  const refresh = async () => {
    const runs = await api('GET', '/runs');
    const sel = new Set($$('.run-sel:checked').map(c => c.value));
    window._runs = runs;
    set('runs', runs.length ? runs.map(r => `<tr><td>${r.status === 'queued' || r.status === 'running' ? '' : `<input type="checkbox" class="run-sel" value="${r.id}" ${sel.has(String(r.id)) ? 'checked' : ''} onchange="selCount()">`}</td><td><a href="#run/${r.id}">${r.id}</a></td><td><a href="#run/${r.id}">${esc(r.name)}</a></td><td>${esc(r.spec.test)}</td><td class="muted">${topoName(r.spec)}</td>
      <td>${badge(r.status)}</td><td>${badge(r.verdict)}</td><td class="num">${fmt(r.status === 'running' ? r.summary.live_gbps : r.summary.tool_gbps)}</td><td class="num">${fmt(r.summary.counter_gbps)}</td><td class="num">${baselineCell(r)}</td><td class="muted" title="${when(r.started_at)}">${ago(r.started_at) || '-'}</td></tr>`).join('')
      : `<tr><td colspan="11" class="empty">No runs yet.</td></tr>`);
    selCount();
  };
  await refresh(); setRefresh(refresh, 5000);
}
function selCount() { const n = $$('.run-sel:checked').length, b = $('#del-sel'); if (b) { b.disabled = !n; b.textContent = n ? `Delete selected (${n})` : 'Delete selected'; } }
function deleteSelectedRuns() {
  const ids = $$('.run-sel:checked').map(c => +c.value); if (!ids.length) return;
  const names = ids.map(id => (window._runs || []).find(r => r.id === id)?.name || '');
  deleteRuns(ids, JSON.stringify(names));
}
function cleanupRuns() {
  modal({ title: 'Clean up runs', body: `<label><input type="checkbox" id="cu-failed" checked> Failed and canceled runs, and runs with a fail verdict</label><br>
    <label>Runs older than <input id="cu-days" type="number" min="0" value="30" style="width:70px"> days (0 = any age)</label>
    <p class="help" id="cu-preview">Counting...</p>
    <label><input type="checkbox" id="cu-samples"> Also delete their per-second samples</label>`,
    actions: [{ label: 'Cancel' }, { label: 'Delete matching runs', cls: 'danger', run: async () => {
      const res = await api('POST', '/runs/delete', { failed: $('#cu-failed').checked, older_than_days: +$('#cu-days').value || 0, samples: $('#cu-samples').checked });
      toast(`Deleted ${res.deleted.length} run${res.deleted.length === 1 ? '' : 's'}` + (res.skipped.length ? `; skipped ${res.skipped.length} (baselines and active runs stay)` : ''), 'pass', 8000); refreshFn?.();
    } }] });
  const preview = async () => {
    const f = $('#cu-failed').checked, d = +$('#cu-days').value || 0;
    if (!f && !d) { set('cu-preview', 'Tick a filter or give an age.'); return; }
    try { const r = await api('GET', `/runs/delete-preview?failed=${f ? 1 : 0}&older_than_days=${d}`); set('cu-preview', `${r.count} run${r.count === 1 ? '' : 's'} match${r.count === 1 ? 'es' : ''} (baselines are kept unless forced).`); } catch (e) { set('cu-preview', e.message); }
  };
  $('#cu-failed').onchange = preview; $('#cu-days').oninput = preview; preview();
}
// pcieCell: "Gen5 x4" with the card's maximum, red when the link came up slower or narrower than the card can do.
function pcieCell(p) {
  const l = p.pcie; if (!l || !l.gen) return '<span class="muted">-</span>';
  const cur = `Gen${l.gen} x${l.width}`, max = l.max_gen ? `Gen${l.max_gen} x${l.max_width}` : '';
  const down = l.max_gen && (l.gen < l.max_gen || l.width < l.max_width);
  const slot = l.slot_gen && (l.slot_gen < l.max_gen || l.slot_width < l.max_width) ? ` Slot is Gen${l.slot_gen} x${l.slot_width}.` : '';
  const usable = l.usable_gbps ? ` About ${fmt(l.usable_gbps, 0)} Gbps usable through this link.` : '';
  return `<span class="mono" style="color:${down ? 'var(--fail)' : 'inherit'}" title="Negotiated ${cur}${max ? ', card supports ' + max : ''}.${slot}${usable}">${cur}${down ? ` <span class="badge fail">below ${max}</span>` : ''}</span>`;
}
// tempCells: "label NIC 44° · optic 49°" per port; amber near the limit, red above it.
function tempCells(ports, opticMax, nicMax) {
  if (!ports.length) return '<span class="muted">-</span>';
  const col = (v, max, near) => v > max ? 'var(--fail)' : v >= max - near ? 'var(--warn)' : 'inherit';
  return ports.map(p => `<span class="chip" title="${esc(p.label || p.netdev)}: NIC chip ${p.nic_c ? fmt(p.nic_c, 0) + ' °C' : 'n/a'}, optic ${p.optic_c ? fmt(p.optic_c, 0) + ' °C' : 'n/a'} (alerts above ${nicMax || 100} / ${opticMax || 70} °C)">${esc(p.label || p.netdev)}
    ${p.nic_c ? ` <span style="color:${col(p.nic_c, nicMax || 100, 10)}">NIC ${fmt(p.nic_c, 0)}°</span>` : ''}${p.optic_c ? ` <span style="color:${col(p.optic_c, opticMax || 70, 5)}">optic ${fmt(p.optic_c, 0)}°</span>` : ''}</span>`).join(' ');
}
function topoName(s) { return s.mesh ? 'mesh' : s.legs?.length ? 'legs' : s.pairs ? 'pairs' : s.serial ? 'serial' : 'fan'; }
// baselineCell: the run's own baseline mark, or its aggregate against the baseline it was compared with.
function baselineCell(r) {
  if (r.baseline) return '<span class="badge info" title="Runs of the same shape are compared with this run">baseline</span>';
  const b = r.summary || {};
  if (!b.baseline_run_id) return '<span class="muted">-</span>';
  return `${deltaPct(b.delta_pct, b.regressed > 0)} <span class="muted">vs <a href="#run/${b.baseline_run_id}">${b.baseline_run_id}</a></span>`;
}
function deltaPct(d, bad) { return `<span class="${bad ? 'delta-bad' : d >= 0 ? 'delta-good' : 'delta-flat'}">${d >= 0 ? '+' : ''}${fmt(d, 1)}%</span>`; }

async function pageRun(token, id) {
  let r; try { r = await api('GET', '/runs/' + id); } catch (e) { mount(token, `<div class="page-head"><h1>Run ${id}</h1></div><div class="card">${esc(e.message)}</div>`); return; }
  const s = r.spec, lat = s.test.endsWith('_lat'), coll = isCollective(s.test);

    : `<th class="num">Expected</th><th class="num" id="th-gbps">Gbps</th><th class="num" title="${coll ? 'What this rank transmitted during the collective, from its NIC counters' : 'From the NIC counters of the port the leg alone used'}">Counter Gbps</th>${s.test === 'tcp' ? '<th class="num">Retransmits</th>' : s.test === 'udp' ? '<th class="num">Loss %</th><th class="num">Jitter ms</th>' : ''}`;
  const headBl = `<th class="num" title="The same leg in the baseline run, and this leg's change against it">Baseline</th>`;
  const headSw = `<th title="Switch ports the leg crossed, from LLDP">Switch path</th>${lat ? '' : '<th class="num" title="Rate the switch counted on the server-side port during the test">Switch Gbps</th>'}<th class="num" title="Average (peak) CPU use on the client / server during the test">CPU %</th>`;
  if (!mount(token, `<div class="page-head"><h1>Run ${r.id}: ${esc(r.name)}</h1><span id="run-badges"></span><span class="spacer"></span><span id="run-actions"></span></div>
    <div id="run-error"></div>
    <div class="tiles" id="run-tiles"></div>

// sweepChart draws a message-size sweep: one line per leg, Gbps over size
// (log scale), with the expected rate as a dashed reference and a hover
// readout. Only for bandwidth runs with more than one size.
const seriesPalette = { light: ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#6250d6', '#e34948'], dark: ['#3987e5', '#d95926', '#199e70', '#c98500', '#d55181', '#008300', '#9085e9', '#e66767'] };
function seriesColor(i) {

  const pal = seriesPalette[dark ? 'dark' : 'light']; return i < pal.length ? pal[i] : 'var(--muted)';
}
function sweepChart(r) {
  const sizes = r.spec.sizes || [];
  if (sizes.length < 2 || r.spec.test.endsWith('_lat') || !(r.legs || []).length) return '';
  const legs = {}; // "client>server" -> {size: gbps}
  let expected = 0;
  if (isCollective(r.spec.test)) {
    // Every rank reports the same collective-wide figures: one series.
    const pts = (r.legs.find(l => l.points) || {}).points || {};
    legs['bus bandwidth'] = Object.fromEntries(Object.entries(pts).map(([k, v]) => [+k, v]));
    expected = Math.max(0, ...r.legs.map(l => l.expected_gbps || 0));
  } else for (const l of r.legs) { const k = `${l.client_host} > ${l.server_host}`; (legs[k] = legs[k] || {})[l.msg_size] = l.tool_gbps; expected = Math.max(expected, l.expected_gbps || 0); }
  const names = Object.keys(legs), xs = [...sizes].sort((a, b) => a - b);
  const W = 760, H = 260, L = 52, R = 16, T = 14, B = 34, pw = W - L - R, ph = H - T - B;
  const ymax = Math.max(expected, ...names.flatMap(n => Object.values(legs[n]))) * 1.08 || 1;
  const x = sz => L + pw * (Math.log2(sz) - Math.log2(xs[0])) / Math.max(1e-9, Math.log2(xs[xs.length - 1]) - Math.log2(xs[0]));
  const y = g => T + ph - ph * g / ymax;
  const fmtSize = sz => sz >= 1048576 ? (sz / 1048576) + ' MiB' : sz >= 1024 ? (sz / 1024) + ' KiB' : sz + ' B';
  const ticks = [0, 0.25, 0.5, 0.75, 1].map(f => f * ymax);
  const grid = ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(t, 0)}</text>`).join('');
  const xt = xs.map(sz => `<text x="${x(sz)}" y="${H - B + 16}" text-anchor="middle" font-size="11" fill="var(--muted)">${fmtSize(sz)}</text>`).join('');
  const exp = expected ? `<line x1="${L}" x2="${W - R}" y1="${y(expected)}" y2="${y(expected)}" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1"/><text x="${W - R}" y="${y(expected) - 4}" text-anchor="end" font-size="11" fill="var(--muted)">expected ${fmt(expected, 0)} Gbps</text>` : '';
  const lines = names.map((n, i) => { const pts = xs.filter(sz => legs[n][sz] != null).map(sz => `${x(sz)},${y(legs[n][sz])}`);
    return `<polyline points="${pts.join(' ')}" fill="none" stroke="${seriesColor(i)}" stroke-width="2" stroke-linejoin="round"/>` + xs.filter(sz => legs[n][sz] != null).map(sz => `<circle cx="${x(sz)}" cy="${y(legs[n][sz])}" r="4" fill="${seriesColor(i)}" stroke="var(--surface)" stroke-width="2"/>`).join(''); }).join('');
  const legend = names.map((n, i) => `<span class="sub" style="display:inline-flex;align-items:center;gap:6px;margin-right:14px"><i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${seriesColor(i)}"></i>${esc(n)}</span>`).join('');
  const data = esc(JSON.stringify({ xs, names, legs }));
  return `<div class="card"><h2>Message size sweep</h2><div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start">
    <svg viewBox="0 0 ${W} ${H}" width="${W}" style="max-width:100%;height:auto" data-sweep="${data}" onmousemove="sweepHover(event,this)" onmouseleave="sweepHover(null,this)">
      ${grid}${xt}${exp}${lines}<g id="sweep-cursor"></g><text x="${L}" y="${T - 2}" font-size="11" fill="var(--muted)">${names.length === 1 && names[0] === 'bus bandwidth' ? 'Bus bandwidth, Gbps' : 'Gbps per leg'}</text></svg>
    <div style="min-width:160px"><div>${legend}</div><div id="sweep-read" class="muted" style="font-size:12px;margin-top:10px">Hover a size for the figures.</div></div></div></div>`;
}
function sweepHover(ev, svg) {
  const g = svg.querySelector('#sweep-cursor'), read = $('#sweep-read');
  if (!ev) { g.innerHTML = ''; if (read) read.textContent = 'Hover a size for the figures.'; return; }
  const d = JSON.parse(svg.dataset.sweep), pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  const W = 760, L = 52, R = 16, pw = W - L - R, lo = Math.log2(d.xs[0]), hi = Math.log2(d.xs[d.xs.length - 1]);
  const lx = lo + (p.x - L) / pw * (hi - lo);
  const sz = d.xs.reduce((a, b) => Math.abs(Math.log2(b) - lx) < Math.abs(Math.log2(a) - lx) ? b : a);
  const x = L + pw * (Math.log2(sz) - lo) / Math.max(1e-9, hi - lo);
  g.innerHTML = `<line x1="${x}" x2="${x}" y1="14" y2="226" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 3"/>`;
  if (read) read.innerHTML = `<b>${sz} B</b><br>` + d.names.map((n, i) => `<span style="color:${seriesColor(i)}">●</span> ${esc(n)}: ${fmt(d.legs[n][sz])} Gbps`).join('<br>');
}

function grafanaSwitchURL(r) {

// picker: a multi-value selector. Chips hold the chosen values, the text box
// (with the host/tag datalist) adds more, and a hidden input carries the
// comma-joined list for the form.
let lastPicker = null;
function picker(name, values, placeholder, width) {
  const vals = values || [];
  return `<div class="picker" data-name="${name}" style="width:${width}px" onclick="if(event.target===this)this.querySelector('.pick-in').focus()">
    ${vals.map(pickChip).join('')}<input class="pick-in" list="sel" placeholder="${esc(placeholder)}"
      onfocus="lastPicker=this.parentNode" onchange="pickAdd(this.parentNode, this.value); this.value=''"
      onkeydown="pickKey(event, this)"><input type="hidden" name="${name}" value="${esc(vals.join(', '))}"></div>`;
}
function pickChip(v) { return `<span class="chip" data-v="${esc(v)}">${esc(v)}<button type="button" title="Remove" onclick="pickDel(this)">×</button></span>`; }
function pickSync(box) { box.querySelector('input[type=hidden]').value = [...box.querySelectorAll('.chip')].map(c => c.dataset.v).join(', '); }
function pickAdd(box, text) {
  box = box || lastPicker || [...document.querySelectorAll('.picker')].find(b => b.offsetParent);
  if (!box) return;
  const have = new Set([...box.querySelectorAll('.chip')].map(c => c.dataset.v));
  const inp = box.querySelector('.pick-in');
  for (const v of list(text)) if (!have.has(v)) { inp.insertAdjacentHTML('beforebegin', pickChip(v)); have.add(v); }
  pickSync(box); lastPicker = box;
}
function pickDel(btn) { const box = btn.closest('.picker'); btn.parentNode.remove(); pickSync(box); }
function pickKey(ev, inp) {
  if (ev.key === 'Enter' || ev.key === ',') { ev.preventDefault(); pickAdd(inp.parentNode, inp.value); inp.value = ''; }
  else if (ev.key === 'Backspace' && !inp.value) { const c = inp.parentNode.querySelectorAll('.chip'); if (c.length) { c[c.length - 1].remove(); pickSync(inp.parentNode); } }
}
function pickFlush(box) { const inp = box.querySelector('.pick-in'); if (inp.value.trim()) { pickAdd(box, inp.value); inp.value = ''; } }
function topoChange(t) { $('#t-cs').style.display = (t === 'cs' || t === 'pairs') ? '' : 'none'; $('#t-mesh').style.display = t === 'mesh' ? '' : 'none'; $('#t-legs').style.display = t === 'legs' ? '' : 'none'; }
async function startRun(ev) {
  ev.preventDefault();
  document.querySelectorAll('.picker').forEach(pickFlush);
  const f = new FormData(ev.target), g = k => f.get(k);
  const spec = { name: g('name'), test: g('test'), duration_sec: +g('duration_sec'), msg_size: +g('msg_size') || 0, qps: +g('qps'), streams: +g('streams'),
    pass_pct: +g('pass_pct'), max_lat_p99_us: +g('max_lat_p99_us') || 0, max_loss_pct: +g('max_loss_pct') || 0, regress_pct: +g('regress_pct') || 0, bidir: !!g('bidir'), serial: !!g('serial'),
    sizes: list(g('sizes')).map(Number).filter(Boolean) };
  const topo = g('topo');
  if (isCollective(spec.test)) spec.hosts = list(g('hosts'));
  else if (topo === 'mesh') { spec.mesh = true; spec.hosts = list(g('hosts')); }
  else if (topo === 'legs') spec.legs = list(g('legs')).map(l => { const [c, s] = l.split('>'); return { client: (c || '').trim(), server: (s || '').trim() }; });
  else { spec.clients = list(g('clients')); spec.servers = list(g('servers')); spec.pairs = topo === 'pairs'; }
  const b = $('#start'); b.disabled = true;
  try { const r = await api('POST', '/runs', spec); location.hash = '#run/' + r.id; } catch (e) { fail(e); b.disabled = false; }
  return false;
}

// switchHealth: one line of chips; a hot sensor, a failed fan or PSU turns red.
function switchHealth(h) {
  if (!h) return '<span class="muted">not read yet</span>';
  const hot = (h.temps || []).filter(t => t.high_c && t.c >= t.high_c), maxT = Math.max(0, ...(h.temps || []).map(t => t.c));
  const bad = l => (l || []).filter(x => !x.ok);
  const up = h.uptime_sec ? (h.uptime_sec > 172800 ? Math.floor(h.uptime_sec / 86400) + ' d' : Math.floor(h.uptime_sec / 3600) + ' h') : '';
  return [h.cpu_pct ? `<span class="chip" style="color:${h.cpu_pct > 85 ? 'var(--fail)' : 'inherit'}">CPU ${fmt(h.cpu_pct, 0)}%</span>` : '',
    h.mem_pct ? `<span class="chip">mem ${fmt(h.mem_pct, 0)}%</span>` : '',
    (h.temps || []).length ? `<span class="chip" style="color:${hot.length ? 'var(--fail)' : 'inherit'}" title="${esc((h.temps || []).map(t => `${t.name} ${fmt(t.c, 0)}°${t.high_c ? ' (limit ' + fmt(t.high_c, 0) + ')' : ''}`).join(', '))}">${hot.length ? hot.length + ' sensor' + (hot.length === 1 ? '' : 's') + ' over limit' : 'hottest ' + fmt(maxT, 0) + ' °C'}</span>` : '',
    (h.fans || []).length ? `<span class="chip" style="color:${bad(h.fans).length ? 'var(--fail)' : 'inherit'}" title="${esc(h.fans.map(f => f.name + ' ' + (f.ok ? 'ok' : f.status || 'failed') + (f.rpm ? ' ' + fmt(f.rpm, 0) + ' rpm' : '')).join(', '))}">fans ${h.fans.length - bad(h.fans).length}/${h.fans.length}</span>` : '',
    (h.psus || []).length ? `<span class="chip" style="color:${bad(h.psus).length ? 'var(--fail)' : 'inherit'}" title="${esc(h.psus.map(f => f.name + ' ' + (f.ok ? 'ok' : f.status || 'failed')).join(', '))}">PSU ${h.psus.length - bad(h.psus).length}/${h.psus.length}</span>` : '',
    up ? `<span class="chip" title="${esc(h.last_reboot ? 'Last reboot: ' + h.last_reboot : '')}">up ${up}</span>` : ''].filter(Boolean).join(' ') || '<span class="muted">no readings</span>';
}

      const body = { name: $('#sw-name').value.trim(), address: $('#sw-addr').value.trim(),
        snmp_enabled: $('#sw-snmp').checked, snmp_version: $('#sw-snmpver').value, snmp_community: $('#sw-comm').value,
        gnmi_enabled: $('#sw-gnmi').checked, gnmi_user: $('#sw-user').value, gnmi_password: $('#sw-pass').value, gnmi_port: +$('#sw-port').value || 8080, gnmi_tls: $('#sw-tls').checked };
      try {
        const r = await api('PUT', '/switches/' + encodeURIComponent(body.name), body);
        closeModal(); refreshFn?.();
        if (r.snmp && !r.snmp.ok) toast('Saved, but SNMP failed: ' + r.snmp.message, 'warn', 9000);
        else toast('Saved' + (r.snmp ? '; SNMP sees ' + r.snmp.ports + ' interfaces' : '') + (r.gnmi ? '; gNMI data appears within a minute once gnmic connects' : ''), 'pass', 7000);
      } catch (e) { fail(e); }
    } }] });
}
async function testSwitch(name) {
  try {
    const r = await api('POST', '/switches/' + encodeURIComponent(name) + '/test');
    const parts = [];
    if (r.snmp) parts.push('SNMP ' + (r.snmp.ok ? 'ok, ' : 'failed: ') + r.snmp.message);
    if (r.gnmi) parts.push('gNMI ' + (r.gnmi.ok ? 'ok, ' : '') + r.gnmi.message);
    toast(parts.join(' · '), (r.snmp && !r.snmp.ok) || (r.gnmi && !r.gnmi.ok) ? 'warn' : 'pass', 9000);
    refreshFn?.();
  } catch (e) { fail(e); }
}
function delSwitch(name) { confirmBox('Remove switch', `Stop collecting from "${name}"? Its history stays in Grafana.`, 'Remove', async () => { await api('DELETE', '/switches/' + encodeURIComponent(name)); refreshFn?.(); }); }

/* ---------- alerts ---------- */
async function pageAlerts(token) {
  if (!mount(token, `<div class="page-head"><h1>Alerts</h1><span class="spacer"></span><label class="row inline sub"><input type="checkbox" id="all" onchange="refreshFn()"> include resolved</label>
      <button class="danger" id="clear-all" onclick="clearAlerts()">Clear all</button></div>
    <p class="help">Opened by the controller for agents that stop reporting, ports with an address that leave ACTIVE, error counters that grow while no test runs (counters that grow during a run belong to that run's result), hot transceivers, cables whose settings differ from their fabric profile (see Fabric check), failed runs and failed updates. They close themselves when the condition clears, idle-error alerts after 15 minutes without further growth; "Clear" resolves one by hand (an alert whose cause is still present comes back on the next check).</p>
    <div class="tbl"><table><thead><tr><th>State</th><th>Kind</th><th>Host</th><th>Port</th><th>Message</th><th>Opened</th><th>Resolved</th><th></th></tr></thead><tbody id="alerts"></tbody></table></div>`)) return;
  const refresh = async () => {
    const all = $('#all')?.checked;
    const alerts = await api('GET', '/alerts' + (all ? '?all=1' : ''));
    const open = alerts.filter(a => !a.resolved_at).length;
    const b = $('#clear-all'); if (b) b.style.display = open ? '' : 'none';
    set('alerts', alerts.length ? alerts.map(a => `<tr><td>${badge(a.resolved_at ? 'resolved' : 'open', a.resolved_at ? 'pass' : 'fail')}</td><td>${esc(a.kind)}</td><td>${esc(a.host)}</td><td>${esc(a.port)}</td><td class="wrap">${esc(a.message)}</td><td class="muted">${when(a.opened_at)}</td><td class="muted">${when(a.resolved_at)}</td><td class="num">${a.resolved_at ? '' : `<button onclick="clearAlert(${a.id})">Clear</button>`}</td></tr>`).join('')
      : `<tr><td colspan="8" class="empty">No ${all ? '' : 'open '}alerts.</td></tr>`);
  };
  await refresh(); setRefresh(refresh, 10000);
}
async function clearAlert(id) {
  try { await api('POST', `/alerts/${id}/clear`); toast('Alert cleared'); refreshFn(); alertBadge(); } catch (e) { fail(e); }
}
function clearAlerts() {
  confirmBox('Clear all alerts', 'Resolve every open alert? Any whose cause is still present will open again on the next check.', 'Clear all', async () => {
    try { const r = await api('POST', '/alerts/clear'); toast(`Cleared ${r.cleared} alert${r.cleared === 1 ? '' : 's'}`); refreshFn(); alertBadge(); } catch (e) { fail(e); }
  });
}

/* ---------- global ---------- */
async function alertBadge() {
  try { const alerts = await api('GET', '/alerts'); const n = alerts.length; const b = $('#alert-count'); b.textContent = n; b.style.display = n ? '' : 'none';
    const f = alerts.filter(a => a.kind === 'fabric_mismatch').length, fb = $('#fabric-count'); fb.textContent = f; fb.style.display = f ? '' : 'none'; } catch {}
}
api('GET', '/status').then(s => { $('#ver').textContent = 'controller ' + s.version; $('#grafana').href = s.grafana_url || ('http://' + location.hostname + ':3000'); whoami(s.whoami); }).catch(() => {});
// whoami shows who is signed in and trims the UI for a viewer (the API
// refuses their writes anyway; this spares them the buttons).
function whoami(w) {
  if (!w) return;
  $('#me').textContent = `${w.name}${w.role === 'viewer' ? ' (read only)' : ''}`;
  $('#signout').style.display = w.via === 'sso' ? '' : 'none';
  $('#pwbtn').style.display = w.via === 'password' ? '' : 'none';
  document.body.classList.toggle('viewer', w.role === 'viewer');
}
async function signOut() { try { await fetch('/logout', { method: 'POST' }); } catch (e) { } location.href = '/login'; }
alertBadge(); setInterval(() => { if (!document.hidden) alertBadge(); }, 30000);
setInterval(() => { $('#clock').textContent = new Date().toLocaleTimeString(); }, 1000);
route();
</script>
</body>
